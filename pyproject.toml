[project]
name = "gutsygit"
version = "0.7.0"
description = "Command-line tool for fast git usage"
authors = [
    { name = "Sander Land" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["git", "productivity"]
dependencies = [
    "GitPython>=3",
    "colorama>=0.4.4",
]

[project.urls]
Repository = "http://github.com/sanderland/gutsygit"

[project.scripts]
gg = "gutsygit.main:run"

[dependency-groups]
dev = [
    "pytest>=6.2.4",
    "twine>=3.4.1",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

